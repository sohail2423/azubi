<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ausbildungsbericht Generator</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }
    body {
      background-color: #f4f6f9;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      background: #ffffff;
      padding: 25px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    h1 {
      color: #333;
      text-align: center;
      margin-bottom: 20px;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      font-weight: bold;
      margin-bottom: 5px;
      color: #555;
    }
    input[type="text"], input[type="date"], textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 14px;
    }
    textarea {
      resize: vertical;
      min-height: 100px;
    }
    button {
      width: 100%;
      background-color: #0056b3;
      color: white;
      border: none;
      padding: 12px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      margin-top: 10px;
    }
    button:hover {
      background-color: #003d82;
    }
    .output-group {
      margin-top: 25px;
      padding-top: 20px;
      border-top: 2px solid #eee;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Ausbildungsbericht Generator</h1>
    
    <div class="form-group">
      <label for="azubiName">Name des Auszubildenden:</label>
      <input type="text" id="azubiName" placeholder="Max Mustermann">
    </div>

    <div class="form-group">
      <label for="reportDate">Datum / Woche:</label>
      <input type="text" id="reportDate" placeholder="01.09.2026 - 05.09.2026">
    </div>

    <div class="form-group">
      <label for="department">Abteilung / Bereich:</label>
      <input type="text" id="department" placeholder="z.B. IT-Support / Entwicklung">
    </div>

    <div class="form-group">
      <label for="tasks">Ausgeführte Tätigkeiten / Stichpunkte:</label>
      <textarea id="tasks" placeholder="- Stichpunkte der Woche hier eingeben..."></textarea>
    </div>

    <button onclick="generateReport()">Bericht Erstellen</button>

    <div class="output-group">
      <label for="reportOutput">Fertiger Ausbildungsbericht:</label>
      <textarea id="reportOutput" rows="12" placeholder="Ihr erstellter Bericht erscheint hier..."></textarea>
    </div>
  </div>

  <script>
    function generateReport() {
      const name = document.getElementById('azubiName').value.trim();
      const date = document.getElementById('reportDate').value.trim();
      const dept = document.getElementById('department').value.trim();
      const tasks = document.getElementById('tasks').value.trim();
      const output = document.getElementById('reportOutput');

      if (!tasks) {
        alert("Bitte geben Sie die ausgeführten Tätigkeiten ein!");
        return;
      }

      // Formatierter Bericht ohne API / KI
      let formattedReport = `AUSBILDUNGSBERICHT\n`;
      formattedReport += `===================\n`;
      if (name) formattedReport += `Name: ${name}\n`;
      if (date) formattedReport += `Zeitraum: ${date}\n`;
      if (dept) formattedReport += `Abteilung: ${dept}\n`;
      formattedReport += `\nAusgeführte Tätigkeiten:\n`;
      formattedReport += `------------------------\n`;
      formattedReport += `${tasks}\n\n`;
      formattedReport += `Datum: ${new Date().toLocaleDateString('de-DE')}\n`;
      formattedReport += `Unterschrift Auszubildender: _______________\n`;
      formattedReport += `Unterschrift Ausbilder:     _______________`;

      output.value = formattedReport;
    }
  </script>

</body>
</html>
