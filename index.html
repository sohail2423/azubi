<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Uygulama</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      padding: 0;
      background-color: #f4f4f9;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    input, button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
    }
    button {
      background-color: #007bff;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover {
      background-color: #0056b3;
    }
    #result {
      margin-top: 20px;
      padding: 10px;
      background-color: #e9ecef;
      border-radius: 4px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Basit Web Uygulaması</h2>
    <p>Aşağıya bir metin yazın:</p>
    
    <input type="text" id="userInput" placeholder="Mesajınızı girin...">
    <button onclick="processInput()">Gönder</button>

    <div id="result">Sonuç burada görünecek.</div>
  </div>

  <script>
    function processInput() {
      const input = document.getElementById('userInput').value;
      const resultDiv = document.getElementById('result');

      if (input.trim() === "") {
        resultDiv.innerText = "Lütfen bir metin girin!";
        return;
      }

      // Normal JavaScript mantığı (Örn: Giren metni büyük harfe çevirme)
      resultDiv.innerText = "Girdiğiniz metin: " + input.toUpperCase();
    }
  </script>

</body>
</html>
